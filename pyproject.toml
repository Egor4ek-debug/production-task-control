[tool.poetry]
name = "production-task-control"
version = "0.1.0"
description = "Контроль сменных заданий"
authors = ["Egor4ek-debug <egornabatov4@gmail.com>"]
readme = "README.md"
packages = [{ include = "your_package_name" }]  # если нужно, можно опустить

[tool.poetry.dependencies]
python = ">=3.13"
fastapi = ">=0.116.1,<0.117.0"
uvicorn = ">=0.35.0,<0.36.0"
sqlalchemy = ">=2.0.41,<3.0.0"
asyncpg = ">=0.30.0,<0.31.0"
alembic = ">=1.16.4,<2.0.0"
pydantic = ">=2.11.7,<3.0.0"
dotenv = ">=0.9.9,<0.10.0"
psycopg2 = ">=2.9.10,<3.0.0"
pytest = ">=8.4.1,<9.0.0"
httpx = ">=0.28.1,<0.29.0"
pytest-asyncio = ">=1.1.0,<2.0.0"
pytest-cov = ">=6.2.1,<7.0.0"

[tool.poetry.group.dev.dependencies]
pytest-order = "^1.3.0"
